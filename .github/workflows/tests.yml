name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Link checkout as the tap
        run: |
          tap="$(brew --repository)/Library/Taps/dav-ayman"
          mkdir -p "$tap"
          rm -rf "$tap/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$tap/homebrew-tap"
      - name: Audit
        run: brew audit --strict --online dav-ayman/tap/claude-profiles
      - name: Install
        run: brew install dav-ayman/tap/claude-profiles
      - name: Test
        run: brew test dav-ayman/tap/claude-profiles
